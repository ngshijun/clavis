# Edge Functions
# All functions use verify_jwt = false because:
# 1. Functions that need auth handle it internally via getAuthenticatedUser()
# 2. Relay-level JWT verification is incompatible with ECC (P-256) JWT signing keys
# 3. Supabase recommends function-owned auth over relay verification

[functions.create-user]
verify_jwt = false
# Without this the bundler cannot resolve the bare "@supabase/..." specifiers.
import_map = "./functions/deno.json"

# Storage Buckets
# The migrations create the buckets. This one is named here only so that
# `supabase db reset` uploads the seed's pictures into it (see seed.sql);
# its settings repeat the migration's.

[storage.buckets."question-images"]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif"]
objects_path = "./seed/question-images"
