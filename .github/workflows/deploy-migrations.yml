name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Push database migrations
        # --include-all applies migrations whose version predates the latest one
        # already on the remote. Needed when a hotfix is applied to prod ahead of
        # older staging migrations (out-of-order history); a no-op for in-order pushes.
        run: supabase db push --include-all
