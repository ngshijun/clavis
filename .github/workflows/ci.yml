name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Placeholder values so the build's environment check passes; CI does not
      # run the app. Real values come from Vercel at deploy time.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: placeholder

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local development setup
        run: supabase db start

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The build also compiles the translations that the type check reads.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Verify generated types are checked in
        run: |
          pnpm db:types
          if ! git diff --exit-code src/lib/database.types.ts; then
            echo ""
            echo "src/lib/database.types.ts does not match the migrations (diff above)."
            echo "Regenerate it against the local stack with: pnpm db:types"
            exit 1
          fi
